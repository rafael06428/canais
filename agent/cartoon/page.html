<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}svg{display:block;font-family:"DejaVu Sans",Arial,sans-serif}</style></head>
<body><svg id="sv"></svg>
<script>
const Q = new URLSearchParams(location.search), MODE = Q.get('mode') || 'long';
const sv = document.getElementById('sv');
if (MODE === 'short') { sv.setAttribute('width', 1080); sv.setAttribute('height', 1920); sv.setAttribute('viewBox', '0 0 1080 1920'); }
else { const W = +(Q.get('w') || 1920); sv.setAttribute('width', W); sv.setAttribute('height', W * 9 / 16); sv.setAttribute('viewBox', '0 0 1280 720'); }
</script>
<script src="data.js"></script>
<script src="engine.js"></script>
</body></html>
