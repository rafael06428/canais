<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.stars{background-color:#040b12;background-size:1920px 1080px}
#sky h1{position:absolute;left:120px;top:210px;font:400 150px Anton;letter-spacing:.03em;white-space:nowrap}
#sky .sub{position:absolute;left:126px;top:430px}
#chart .big72{position:absolute;right:140px;top:110px;text-align:right}
#chart .big72 b{font:400 260px Anton;line-height:.9;font-variant-numeric:tabular-nums;display:block}
#print .sheet{position:absolute;left:800px;top:70px;width:1010px;height:940px;overflow:hidden;background:linear-gradient(180deg,#0a1a27,#081520);border:1px solid #1d3a4e;border-radius:6px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
#grid{position:absolute;left:0;top:0;width:1010px;transform-origin:545px 470px}
#grid .row{height:47px;white-space:pre;font:400 34px "Anonymous Pro",monospace;color:#8fb3c7;letter-spacing:13.5px;padding-left:34px}
#grid .row span{display:inline-block;width:30.5px;text-align:center;letter-spacing:0}
#grid .hit{color:#ff6b3d;font-weight:700;text-shadow:0 0 18px rgba(255,107,61,.9)}
#ink{position:absolute;left:0;top:0;width:1010px;height:1400px;overflow:visible}
#freq .dialnum{font:400 250px Anton;line-height:.9;font-variant-numeric:tabular-nums}
#never .t{position:absolute;left:0;right:0;top:560px;text-align:center;font:400 104px Anton;letter-spacing:.04em;text-transform:uppercase}
#end .a{position:absolute;left:0;right:0;top:250px;text-align:center;font:400 230px Anton}
#end .c{position:absolute;left:0;right:0;top:840px;text-align:center;font:600 30px Inter;letter-spacing:.24em;color:#c4dbe7}
.dlabel{font:700 20px Inter;letter-spacing:.24em;fill:#c4dbe7;text-anchor:middle}
</style></head>
<body><div id="stage">

<!-- A: night sky + telescope -->
<div id="sky" class="layer stars">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs">
    <defs><linearGradient id="beamg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7fd6ff" stop-opacity=".22"/><stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="hor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2233" stop-opacity="0"/><stop offset="1" stop-color="#123247" stop-opacity=".9"/></linearGradient></defs>
    <rect y="620" width="1920" height="300" fill="url(#hor)"/>
    <g id="beam"><path d="M-70,0 L-260,-1100 L260,-1100 L70,0Z" fill="url(#beamg)"/></g>
    <g fill="#07141e" stroke="#3f6d86" stroke-width="2.5" stroke-linejoin="round">
      <path d="M1020,905 L1075,690 L1335,690 L1390,905Z"/>
      <path d="M1100,690 L1047,905 M1150,690 L1110,905 M1205,690 L1205,905 M1260,690 L1300,905 M1310,690 L1363,905 M1062,740 L1348,740 M1048,795 L1362,795 M1034,850 L1376,850" fill="none" stroke-width="1.5" opacity=".7"/>
      <path d="M1640,905 C1650,760 1690,640 1770,560 L1790,575 C1720,655 1688,765 1682,905Z"/>
      <path d="M1682,905 L1800,905 L1788,585 M1700,800 L1796,800 M1722,700 L1792,700" fill="none" stroke-width="2"/>
      <rect x="1455" y="872" width="70" height="33"/><path d="M1490,872 L1490,842 L1470,832" fill="none"/>
    </g>
    <rect y="903" width="1920" height="177" fill="#040b12"/><path d="M0,904 H1920" stroke="#3f6d86" stroke-width="2.5"/>
  </svg>
  <h1 id="s_title"></h1>
  <div class="sub lbl" id="s_sub">Delaware, Ohio · The “Big Ear” radio telescope</div>
</div>

<!-- B: signal chart -->
<div id="chart" class="layer bgdeep">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs">
    <defs><clipPath id="penclip"><rect id="penrect" x="0" y="0" width="0" height="1080"/></clipPath>
    <linearGradient id="sigfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/></linearGradient></defs>
    <g stroke="rgba(255,255,255,.08)" stroke-width="1"><path d="M160,360 H1760 M160,460 H1760 M160,560 H1760 M160,660 H1760"/></g>
    <path d="M160,300 V780 H1760" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
    <text x="160" y="826" class="dlabel" style="text-anchor:start">TIME →</text>
    <text x="134" y="770" class="dlabel" transform="rotate(-90 134 770)" style="text-anchor:start">SIGNAL STRENGTH</text>
    <g clip-path="url(#penclip)"><path id="sigarea" fill="url(#sigfill)"/><path id="sigline" fill="none" stroke="#7fd6ff" stroke-width="3" stroke-linejoin="round"/><path id="sighot" fill="none" stroke="#ff6b3d" stroke-width="5" stroke-linejoin="round"/></g>
    <g id="pen"><circle r="16" fill="#ff6b3d" opacity=".3"/><circle r="7" fill="#fff"/></g>
    <g id="span72" opacity="0"><path d="M560,850 V874 H1360 V850" fill="none" stroke="#ff6b3d" stroke-width="3"/><text x="960" y="912" class="dlabel" style="fill:#ff6b3d">72 SECONDS</text></g>
  </svg>
  <div class="big72"><b id="n72">0</b><span class="lbl">seconds</span></div>
</div>

<!-- C: printout -->
<div id="print" class="layer bgdeep">
  <div class="sheet"><div id="grid"><svg id="ink" viewBox="0 0 1010 1400"></svg></div></div>
</div>

<!-- D: frequency -->
<div id="freq" class="layer bgdeep">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs">
    <g id="dial"></g>
    <g id="atom" transform="translate(1340,690)">
      <circle r="150" fill="none" stroke="rgba(127,214,255,.35)" stroke-width="2" stroke-dasharray="4 9"/>
      <circle r="26" fill="#ff6b3d"/><circle r="46" fill="#ff6b3d" opacity=".18"/>
      <g id="electron"><circle cx="150" r="12" fill="#7fd6ff"/><circle cx="150" r="24" fill="#7fd6ff" opacity=".2"/></g>
      <text y="238" class="dlabel" style="font:400 64px Anton;fill:#fff;letter-spacing:.08em">HYDROGEN</text>
      <text y="280" class="dlabel">THE MOST COMMON ELEMENT IN THE UNIVERSE</text>
    </g>
  </svg>
</div>

<!-- E: Sagittarius -->
<div id="sag" class="layer stars">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs">
    <g id="const"></g>
    <g id="ret"><circle r="46" fill="none" stroke="#ff6b3d" stroke-width="3"/><path d="M-70,0 H-22 M22,0 H70 M0,-70 V-22 M0,22 V70" stroke="#ff6b3d" stroke-width="3"/><circle id="retring" r="46" fill="none" stroke="#ff6b3d" stroke-width="2"/></g>
    <text id="retlab" class="dlabel" style="fill:#ff6b3d">SIGNAL SOURCE</text>
    <g id="years"><path d="M360,950 H1700" stroke="rgba(255,255,255,.25)" stroke-width="3"/><path id="yfill" d="M360,950 H360" stroke="#ff6b3d" stroke-width="3"/>
      <text x="360" y="1000" class="dlabel">1977</text><text x="1700" y="1000" class="dlabel">2026</text><g id="xs"></g><circle id="yknob" cy="950" r="9" fill="#fff"/></g>
  </svg>
</div>

<!-- F: never again -->
<div id="never" class="layer" style="background:#02060a">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs"><path id="flat" fill="none" stroke="#7fd6ff" stroke-width="3" opacity=".8"/></svg>
  <div class="t" id="nevert">It has never been heard again.</div>
</div>

<!-- G: 2024 hypothesis -->
<div id="hyp" class="layer bgdeep">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" class="abs">
    <defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <radialGradient id="flareg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#bfe9ff" stop-opacity=".7"/><stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/></radialGradient></defs>
    <g id="earth" transform="translate(1590,600)"><circle r="54" fill="#12324a" stroke="#7fd6ff" stroke-width="3"/><path d="M-30,-20 q20,-18 40,-4 q14,12 -4,22 q-22,10 -36,-18Z M4,22 q16,-6 26,6 q-8,16 -26,-6Z" fill="#3f6d86"/><text y="112" class="dlabel">EARTH</text></g>
    <g id="cloud" transform="translate(960,600)"><g filter="url(#blur)"><ellipse rx="150" ry="100" fill="#7fd6ff"/><ellipse cx="-90" cy="40" rx="100" ry="70" fill="#7fd6ff"/><ellipse cx="100" cy="-40" rx="110" ry="74" fill="#bfe9ff"/></g></g>
    <text id="cloudlab" x="960" y="790" class="dlabel">A CLOUD OF COLD HYDROGEN</text>
    <g id="star" transform="translate(330,600)"><circle id="flare" r="10" fill="url(#flareg)"/><circle r="9" fill="#fff"/><text y="112" class="dlabel">A DEAD STAR</text></g>
    <circle id="wave" cx="330" cy="600" r="0" fill="none" stroke="#bfe9ff" stroke-width="5"/>
    <path id="tobeam" d="M1110,600 H1530" stroke="#ff6b3d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle id="hit" cx="1590" cy="600" r="54" fill="none" stroke="#ff6b3d" stroke-width="4"/>
  </svg>
  <div class="center" id="best" style="top:880px;font:400 54px Anton;letter-spacing:.08em;text-transform:uppercase">The best explanation so far</div>
  <div class="stamp" id="notproven" style="left:640px;top:380px">Not proven</div>
</div>

<!-- H: end -->
<div id="end" class="layer stars">
  <div class="a anton" id="e72">72 seconds.</div>
  <svg class="abs" style="left:700px;top:520px" width="520" height="260" viewBox="-20 -20 300 140"><path id="wow2" d="M0,10 L18,90 L40,30 L62,90 L84,8 M131,62 a22,26 0 1,0 -44,0 a22,26 0 1,0 44,0 M146,38 L160,90 L176,52 L192,90 L208,36 M234,4 L230,66 M229,88 l1,2" fill="none" stroke="#ff4a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="c" id="ec">NO ONE CAN SAY FOR CERTAIN WHAT WAS ON THE OTHER END</div>
</div>

<div id="hudL" class="layer" style="pointer-events:none"><div id="brand"><b>The Wow! signal</b><i>Big Ear Observatory · 1977</i></div></div>
<div id="cards" class="layer" style="pointer-events:none"></div>
<canvas id="fx" width="1920" height="1080"></canvas><div id="vig"></div><div id="black"></div>
</div>
<script src="v4_timing.js"></script><script src="lib.js"></script>
<script>
/* ---- star field (drawn once) ---- */
(() => { const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const x = c.getContext('2d'); reseed(4242);
  for (let i = 0; i < 520; i++) { const r = rnd() ** 3 * 2.2 + .4; x.globalAlpha = .25 + rnd() * .7; x.fillStyle = rnd() > .85 ? '#bfe9ff' : '#fff'; x.beginPath(); x.arc(rnd() * 1920, rnd() * 1080, r, 0, 6.3); x.fill(); }
  const url = `url(${c.toDataURL()})`; $$('.stars').forEach(e => e.style.backgroundImage = url); })();
const WOW = 'M0,10 L18,90 L40,30 L62,90 L84,8 M131,62 a22,26 0 1,0 -44,0 a22,26 0 1,0 44,0 M146,38 L160,90 L176,52 L192,90 L208,36 M234,4 L230,66 M229,88 l1,2';

/* ---- scenes ---- */
scene('#sky', 0, 9.6, .8, .5); scene('#chart', 9.6, 19.8); scene('#print', 19.8, 38.2); scene('#freq', 38.2, 52.5);
scene('#sag', 52.5, 62.9); scene('#never', 62.9, 64.95, .3, .4); scene('#hyp', 64.95, 78.4); scene('#end', 78.4, 999);
scene('#hudL', 10.2, 78.2); fadeBlack(85.5, 1.9);
particles('dust', t => .25, 70);

/* A */
typer('#s_title', 'AUGUST 15, 1977', B(0), 2.6, true); show('#s_sub', W(0, 'radio'), 99, { dy: 20 });
onRender(t => $('#beam').setAttribute('transform', `translate(1715,640) rotate(${-18 + Math.sin(t * .45) * 7})`));
onRender(t => { $('#sky').style.backgroundPosition = `${-t * 6}px 0`; });

/* B: chart. pen x: noise until 560, the signal over 560..1360 (72 s), noise after */
const X0 = 160, X1 = 1760, YB = 760, noiseY = x => Math.sin(x * .071) * 5 + Math.sin(x * .193 + 1) * 4 + Math.sin(x * .41 + 2) * 3;
const sigY = x => 440 * Math.exp(-((x - 960) ** 2) / (2 * 150 ** 2));
let dl = '', dh = '', da = `M560,${YB}`;
for (let x = X0; x <= X1; x += 4) { const y = YB - 30 - noiseY(x) - sigY(x); dl += (x === X0 ? 'M' : 'L') + x + ',' + y.toFixed(1); if (x >= 560 && x <= 1360) { dh += (dh ? 'L' : 'M') + x + ',' + y.toFixed(1); da += `L${x},${y.toFixed(1)}`; } }
$('#sigline').setAttribute('d', dl); $('#sighot').setAttribute('d', dh); $('#sigarea').setAttribute('d', da + `L1360,${YB}Z`);
const tA = W(1, 'signal') - .4, tB = W(1, 'gone') - .35;
track('pen', X0, [[B(1), tA - B(1), 560, 'lin'], [tA, tB - tA, 1360, 'lin'], [tB, 1.1, X1, 'lin']]);
onRender(() => { const x = st.pen; $('#penrect').setAttribute('width', x); $('#pen').setAttribute('transform', `translate(${x},${YB - 30 - noiseY(x) - sigY(x)})`); $('#n72').textContent = Math.round(clamp((x - 560) / 800) * 72); });
showS('#span72', W(1, 'seventy'), 99);
card('#cards', 190, { k: 'That night', t: 'Something<br>arrives' }, B(1) + .2, W(1, 'Then') - .2);
card('#cards', 190, { k: 'And then', t: 'It is gone' }, W(1, 'Then'), 19.6);

/* C: printout grid */
reseed(77); const ROWS = 30, COLS = 22, R0 = 15, C0 = 11, CODE = '6EQUJ5'; const grid = $('#grid'), cells = [];
for (let r = 0; r < ROWS; r++) { const row = H('div', 'row', '', grid); for (let c = 0; c < COLS; c++) { let ch = ' '; const u = rnd(); if (u > .55) ch = '1'; if (u > .88) ch = '2'; if (u > .965) ch = '3'; if (u > .99) ch = '4';
    if (c === C0 && r >= R0 && r < R0 + 6) ch = CODE[r - R0]; if (Math.abs(c - C0) === 1 && r >= R0 - 1 && r <= R0 + 6) ch = rnd() > .5 ? '1' : ' '; if (c < C0 - 1 && c > C0 - 8 && r >= R0 && r <= R0 + 3) ch = ' ';
    const sp = H('span', '', ch === ' ' ? '&nbsp;' : ch, row); if (c === C0 && r >= R0 && r < R0 + 6) cells.push(sp); } }
grid.appendChild($('#ink'));
const colX = cells[0].offsetLeft + cells[0].offsetWidth / 2, rowY = r => cells[0].offsetTop - (R0 * 47) + r * 47 + cells[0].offsetHeight / 2;
track('scroll', 0, [[B(2), W(2, 'And') - B(2), -(rowY(R0 + 2.5) - 470), 'out2']]);
track('zoom', 1, [[W(2, 'six') - .4, 2.6, 1.32, 'io2'], [B(3), 3.4, 1.42, 'io2']]);
const hitT = [W(2, 'Six.'), W(2, 'E.'), W(2, 'E.') + .28, W(2, 'U.'), W(2, 'J.'), W(2, 'Five')];
onRender(t => { grid.style.transform = `translateY(${st.scroll}px) scale(${st.zoom})`; grid.style.transformOrigin = `${colX}px ${rowY(R0 + 2.5)}px`;
  cells.forEach((c, i) => c.classList.toggle('hit', t >= hitT[i])); const dim = 1 - .55 * ramp(t, W(2, 'six'), W(2, 'six') + 1);
  $$('#grid .row').forEach(r => r.style.color = `rgba(143,179,199,${dim})`); });
const circ = S('path', { d: `M${colX - 4},${rowY(R0) - 44} C${colX + 46},${rowY(R0) - 40} ${colX + 44},${rowY(R0 + 5) + 34} ${colX},${rowY(R0 + 5) + 40} C${colX - 46},${rowY(R0 + 5) + 36} ${colX - 44},${rowY(R0) - 34} ${colX + 8},${rowY(R0) - 46}`, fill: 'none', stroke: '#ff4a4a', 'stroke-width': 4.5, 'stroke-linecap': 'round' }, $('#ink'));
drawT(circ, W(3, 'circles'), .9);
const wow = S('path', { d: WOW, fill: 'none', stroke: '#ff4a4a', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: `translate(${colX - 232},${rowY(R0 + .8)}) rotate(-7) scale(.68)` }, $('#ink'));
drawT(wow, W(3, 'margin') + .2, 1.2, 'lin');
card('#cards', 300, { k: 'A few days later', t: 'The printout', s: 'Astronomer Jerry Ehman checks the night’s data: rows of ones and twos.' }, B(2) + .2, W(2, 'And') - .2);
card('#cards', 300, { k: 'And then', t: 'Six<br>characters', s: 'that should not be there' }, W(2, 'And'), B(3) - .2);
card('#cards', 300, { k: 'In the margin', t: 'One word' }, B(3) + .1, 38.0);

/* D: frequency dial */
const dial = $('#dial'), FX = f => 900 + (f - 1400) / 40 * 860;
S('path', { d: `M900,330 H1760`, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2 }, dial);
for (let f = 1400; f <= 1440; f += 2) { const big = f % 10 === 0; S('path', { d: `M${FX(f)},330 v${big ? -34 : -16}`, stroke: 'rgba(255,255,255,.55)', 'stroke-width': 2 }, dial); if (big) { const tx = S('text', { x: FX(f), y: 276, class: 'dlabel' }, dial); tx.textContent = f.toLocaleString('en-US'); } }
const needle = S('g', {}, dial); S('path', { d: 'M0,318 V190', stroke: '#ff6b3d', 'stroke-width': 5 }, needle); S('path', { d: 'M-16,348 L16,348 L0,322Z', fill: '#ff6b3d' }, needle);
const mh = S('text', { x: 1760, y: 400, class: 'dlabel', style: 'text-anchor:end' }, dial); mh.textContent = 'MHz';
track('freq', 1400, [[W(4, '1,420') - .2, 2.0, 1420, 'back']]);
onRender(t => { needle.setAttribute('transform', `translate(${FX(st.freq)},0)`); $('#electron').setAttribute('transform', `rotate(${t * 70})`); });
const c4 = card('#cards', 190, { k: 'The frequency', html: '<div class="big"><span id="fnum">1,400</span></div>', s: 'megahertz' }, B(4) + .1, W(4, 'The', 2) - .3);
counter('#fnum', 'freq');
showS('#atom', W(4, 'The', 1), 99, .6);
card('#cards', 300, { k: 'Why it matters', t: 'The place<br>to call', s: 'The very frequency scientists had guessed another civilisation might use.' }, W(4, 'The', 2), 52.3);

/* E: Sagittarius. Sky chart: RA grows to the left */
const SC = 46, sx = (ra, dec) => [1330 - (ra - 18.7) * 15 * Math.cos(28 * Math.PI / 180) * SC, 470 - (dec + 29) * SC];
const STARS = { gam: [18.097, -30.42], del: [18.35, -29.83], eps: [18.403, -34.38], lam: [18.466, -25.42], phi: [18.76, -26.99], sig: [18.921, -26.3], tau: [19.115, -27.67], zet: [19.043, -29.88] };
const P = {}; for (const k in STARS) P[k] = sx(...STARS[k]);
const LINES = [['gam', 'del'], ['del', 'eps'], ['eps', 'gam'], ['eps', 'zet'], ['zet', 'phi'], ['phi', 'del'], ['del', 'lam'], ['lam', 'phi'], ['phi', 'sig'], ['sig', 'tau'], ['tau', 'zet']];
const cg = $('#const'); const tL = W(5, 'direction');
LINES.forEach(([a, b], i) => { const p = S('path', { d: `M${P[a]} L${P[b]}`, stroke: '#7fd6ff', 'stroke-width': 2.5, opacity: .8, fill: 'none' }, cg); drawT(p, tL + i * .16, .35); });
for (const k in P) { S('circle', { cx: P[k][0], cy: P[k][1], r: 14, fill: '#bfe9ff', opacity: .18 }, cg); S('circle', { cx: P[k][0], cy: P[k][1], r: 5.5, fill: '#fff' }, cg); }
const sl = S('text', { x: (P.eps[0] + P.zet[0]) / 2, y: P.eps[1] + 80, class: 'dlabel', style: 'font:400 50px Anton;fill:#fff;letter-spacing:.14em' }, cg); sl.textContent = 'SAGITTARIUS'; showS(sl, W(5, 'Sagittarius'), 99);
const SRC = sx(19.42, -26.95);
track('rx', 960, [[W(5, 'Sagittarius') + .3, 1.2, SRC[0], 'io3']]); track('ry', 300, [[W(5, 'Sagittarius') + .3, 1.2, SRC[1], 'io3']]);
showS('#ret', W(5, 'Sagittarius') + .2, 99, .4); showS('#retlab', W(5, 'Astronomers') - .3, 99);
const tY0 = W(5, 'Astronomers'), tY1 = W(5, 'years') + .5, NX = 11; const xs = $('#xs');
for (let i = 0; i < NX; i++) { const x = 360 + (i + 1) / (NX + 1) * 1340; const g = S('g', { transform: `translate(${x},950)` }, xs); S('path', { d: 'M-9,-9L9,9M9,-9L-9,9', stroke: '#9dbccd', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g); g._t = tY0 + (i + 1) / (NX + 1) * (tY1 - tY0); }
showS('#years', tY0 - .4, 99);
onRender(t => { $('#ret').setAttribute('transform', `translate(${st.rx},${st.ry})`); $('#retlab').setAttribute('x', st.rx); $('#retlab').setAttribute('y', st.ry + 110);
  const p = ramp(t, tY0, tY1), x = 360 + p * 1340; $('#yfill').setAttribute('d', `M360,950 H${x}`); $('#yknob').setAttribute('cx', x);
  let last = -9; [...xs.children].forEach(g => { const on = t >= g._t; g.setAttribute('opacity', on ? 1 : 0); if (on) last = g._t; });
  const u = clamp((t - last) / .7); $('#retring').setAttribute('r', 46 + 70 * u); $('#retring').setAttribute('opacity', last < 0 ? 0 : 1 - u); });
card('#cards', 190, { k: 'Direction', t: 'Sagittarius' }, tL, tY0 - .3);
card('#cards', 190, { k: 'For nearly fifty years', t: 'They keep<br>listening', s: 'Telescopes return to the same spot, again and again.' }, tY0, 62.7);

/* F */
let df = ''; for (let x = 0; x <= 1920; x += 6) df += (x ? 'L' : 'M') + x + ',' + (430 - noiseY(x) * .6).toFixed(1); $('#flat').setAttribute('d', df);

/* G: hypothesis */
card('#cards', 190, { k: '2024', t: 'A proposed answer' }, B(7) + .2, 78.2);
showS('#earth', B(7) + .8, 99); const tC = W(7, 'cloud') - .2, tF = W(7, 'flare'), tS = W(7, 'dead');
